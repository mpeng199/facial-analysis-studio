<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Self-check — Facial Analysis Studio</title>
  <style>
    body { font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 24px; background: #0e0f13; color: #eceef2; }
    .pass { color: #3ecf7a; } .fail { color: #ff5a5f; font-weight: 700; }
    h1 { font-size: 1.1rem; } .sum { margin: 16px 0; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Core math self-check</h1>
  <div id="out"></div>
  <div class="sum" id="sum"></div>

  <script type="module">
    import * as G from "./geometry3d.js";
    import { IDX } from "./landmarks.js";
    import { analyze, METRICS } from "./analysis.js";
    import { delaunay, computeTargets } from "./morph.js";
    import { buildReportHTML } from "./render.js";

    const out = document.getElementById("out");
    let pass = 0, fail = 0;
    function assert(name, cond, detail = "") {
      const ok = !!cond; ok ? pass++ : fail++;
      out.insertAdjacentHTML("beforeend",
        `<div class="${ok ? "pass" : "fail"}">${ok ? "✓" : "✗"} ${name}${ok ? "" : "  — " + detail}</div>`);
    }
    const close = (a, b, tol = 1e-2) => Math.abs(a - b) <= tol;

    // 1. angle + tilt
    const A = { x: 1, y: 0 }, B = { x: 0, y: 0 }, C = { x: Math.cos(Math.PI * 2 / 3), y: Math.sin(Math.PI * 2 / 3) };
    assert("angleDeg computes 120°", close(G.angleDeg(A, B, C), 120, 1e-3), G.angleDeg(A, B, C));
    assert("tilt of level segment ≈ 0°", close(G.tiltToHorizontalDeg({ x: 0, y: 0 }, { x: 10, y: 0 }), 0, 1e-6));
    assert("tilt upward is positive", G.tiltToHorizontalDeg({ x: 0, y: 10 }, { x: 10, y: 0 }) > 0);

    // 2. triangulation round-trip
    function Ryaw(deg) { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
      return [c, 0, s, 0, 1, 0, -s, 0, c]; }
    const K = G.nominalK(640, 480);
    const cams = [
      { R: [1, 0, 0, 0, 1, 0, 0, 0, 1], t: [0, 0, 60] },
      { R: Ryaw(18), t: [0, 0, 60] },
      { R: Ryaw(-15), t: [0, 0, 62] },
    ].map(c => G.projectionMatrix(K, c.R, c.t));
    const Xtrue = { x: 4, y: -3, z: 6 };
    const proj = (P, X) => {
      const xh = P[0] * X.x + P[1] * X.y + P[2] * X.z + P[3];
      const yh = P[4] * X.x + P[5] * X.y + P[6] * X.z + P[7];
      const wh = P[8] * X.x + P[9] * X.y + P[10] * X.z + P[11];
      return { x: xh / wh, y: yh / wh };
    };
    const obs = cams.map(P => { const uv = proj(P, Xtrue); return { P, x: uv.x, y: uv.y }; });
    const Xrec = G.triangulatePoint(obs);
    const err = Math.hypot(Xrec.x - Xtrue.x, Xrec.y - Xtrue.y, Xrec.z - Xtrue.z);
    assert("multi-view triangulation recovers 3D point", err < 1e-2, "err=" + err.toFixed(5));

    // 3. synthetic symmetric face
    const F = Array.from({ length: 478 }, () => ({ x: 0, y: 0, z: 0 }));
    const set = (i, x, y, z = 0) => F[i] = { x, y, z };
    set(IDX.eyeROuter, -30, 0); set(IDX.eyeRInner, -10, 0);
    set(IDX.eyeLInner, 10, 0); set(IDX.eyeLOuter, 30, 0);
    set(IDX.eyeRTop, -20, -5); set(IDX.eyeRBottom, -20, 5);
    set(IDX.eyeLTop, 20, -5); set(IDX.eyeLBottom, 20, 5);
    set(IDX.irisRCenter, -20, 0); IDX.irisRRing.forEach((i, k) => set(i, -20 + 6 * Math.cos(k * Math.PI / 2), 6 * Math.sin(k * Math.PI / 2)));
    set(IDX.irisLCenter, 20, 0); IDX.irisLRing.forEach((i, k) => set(i, 20 + 6 * Math.cos(k * Math.PI / 2), 6 * Math.sin(k * Math.PI / 2)));
    set(IDX.glabella, 0, -10); set(IDX.foreheadTop, 0, -62); set(IDX.nasion, 0, -8, 5);
    set(IDX.noseTip, 0, 20, 20); set(IDX.subnasale, 0, 30, 10);
    set(IDX.alaR, -12, 28, 5); set(IDX.alaL, 12, 28, 5);
    set(IDX.lipTop, 0, 42, 8); set(IDX.lipInnerTop, 0, 45, 8); set(IDX.lipInnerBottom, 0, 49, 8); set(IDX.lipBottom, 0, 53, 8);
    set(IDX.mouthR, -22, 47, 3); set(IDX.mouthL, 22, 47, 3);
    set(IDX.browRApex, -20, -18, 2); set(IDX.browLApex, 20, -18, 2);
    set(IDX.zygoR, -55, 10, -10); set(IDX.zygoL, 55, 10, -10);
    set(IDX.cheekR, -45, 20, -5); set(IDX.cheekL, 45, 20, -5);
    set(IDX.gonionR, -45, 60, -15); set(IDX.gonionL, 45, 60, -15);
    set(IDX.menton, 0, 90, 5);

    // iris scale
    const iris = G.irisScale(F, IDX);
    assert("iris scale is finite & positive", iris && iris.mmPerPx > 0, JSON.stringify(iris));

    // pose-normalize invariance: rotate whole head by yaw, expect same local coords
    const { pts: norm0 } = G.poseNormalize(F, IDX);
    const yaw = 15 * Math.PI / 180, cy = Math.cos(yaw), sy = Math.sin(yaw);
    const Frot = F.map(p => ({ x: cy * p.x + sy * p.z, y: p.y, z: -sy * p.x + cy * p.z }));
    const { pts: norm1 } = G.poseNormalize(Frot, IDX);
    let maxd = 0;
    for (const i of [IDX.eyeROuter, IDX.noseTip, IDX.menton, IDX.mouthR]) {
      maxd = Math.max(maxd, Math.hypot(norm0[i].x - norm1[i].x, norm0[i].y - norm1[i].y, norm0[i].z - norm1[i].z));
    }
    assert("pose-normalization is yaw-invariant", maxd < 1.5, "maxΔ=" + maxd.toFixed(3));

    // analyze end-to-end
    const R = analyze({ F: norm0, P: null, mmPerPx: iris.mmPerPx, blendshapes: [],
      dims: { w: 300, h: 400 }, meta: { sex: "f", age: 27, ethnicity: "european", goal: "natural",
        lifestyle: {}, pose: { yaw: 0, pitch: 0, roll: 0 }, quality: { notes: [] }, scaleSource: "iris" } });
    assert("analyze returns a dashboard", R.dashboard && typeof R.dashboard.attractiveness === "number");
    assert("symmetry of a mirror-symmetric face is high", R.dashboard.symmetry >= 90, R.dashboard.symmetry);
    assert("all dashboard scores are 0–100", Object.values(R.dashboard).every(v => typeof v !== "number" || (v >= 0 && v <= 200)));
    assert("femininity index in range", R.dashboard.femininity >= 0 && R.dashboard.femininity <= 100, R.dashboard.femininity);
    assert("protocol has items", R.protocol.length > 0, R.protocol.length);
    assert("aging trajectory present", R.aging.items.length >= 3);
    assert("results carry scores", R.results.length > 5 && R.results.every(r => r.score >= 0 && r.score <= 100));

    // morph geometry
    const tris = delaunay(F.slice(0, 40).map((p, i) => ({ x: p.x + i, y: p.y + (i % 5) })));
    assert("delaunay returns triangles", tris.length > 0, tris.length);
    const targets = computeTargets(F);
    assert("computeTargets returns finite target set", targets.length === F.length && targets.every(t => isFinite(t.x) && isFinite(t.y)));

    // full report HTML builds without throwing and contains all sections
    let html = "", threw = false;
    try { html = buildReportHTML(R); } catch (e) { threw = true; html = e.message; }
    const div = document.createElement("div"); div.innerHTML = html;
    assert("buildReportHTML does not throw", !threw, html);
    assert("report has a biometric dashboard", div.querySelectorAll(".dial").length >= 6);
    assert("report renders protocol items", div.querySelectorAll(".proto-item").length > 0);
    assert("report renders region cards + timeline", div.querySelector(".timeline") && div.querySelectorAll(".card").length > 4);

    document.getElementById("sum").innerHTML =
      `<b class="${fail ? "fail" : "pass"}">${pass} passed, ${fail} failed.</b>`;
    console.log(`Self-check: ${pass} passed, ${fail} failed.`);
  </script>
</body>
</html>
